[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chlaca"
version = "1.0.0"
description = "💥 BOOM! CHLACA: Cheap and lazy captions for vertical YouTube Shorts & TikTok"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "CHLACA Contributors" }
]
keywords = [
    "subtitles",
    "captions",
    "youtube-shorts",
    "tiktok",
    "reels",
    "faster-whisper",
    "speech-recognition",
    "video-editing",
    "ffmpeg",
    "ass-subtitles"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    "pywebview>=6.0.0",
    "bottle>=0.13.0",
    "faster-whisper>=1.0.0",
    "ctranslate2>=4.0.0",
    "av>=14.0.0",
    "huggingface-hub>=0.20.0",
    "tokenizers>=0.19.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
gpu = [
    "nvidia-cublas-cu12>=12.0.0",
    "nvidia-cudnn-cu12>=9.0.0",
    "nvidia-cuda-nvrtc-cu12>=12.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-timeout",
]
build = [
    "pyinstaller>=6.0.0",
    "pefile>=2024.8.26",
]
all = [
    "chlaca[gpu,dev,build]",
]

[project.scripts]
chlaca = "piccut.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["piccut*"]

[tool.setuptools.package-data]
"piccut.gui" = ["*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"
filterwarnings = [
    "ignore::DeprecationWarning",
]
